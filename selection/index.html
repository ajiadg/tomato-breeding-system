<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>番茄田間選拔記錄器 v1</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#21312b;background:#f4f7f3}*{box-sizing:border-box}body{margin:0}header{background:#245e49;color:white;padding:15px 16px;position:sticky;top:0;z-index:5}header strong{font-size:21px}header small{display:block;opacity:.85;margin-top:4px}main{max-width:800px;margin:auto;padding:12px 12px 90px}section{background:white;border:1px solid #dce5dd;border-radius:15px;margin-bottom:12px;padding:15px}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:16px 0 8px}.muted{color:#64776b;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}button{font:inherit;cursor:pointer;border:1px solid #cbd9ce;border-radius:12px;padding:12px 9px;background:#f6f9f6;color:#21312b;min-height:48px}button.primary{background:#286a50;color:white;border-color:#286a50;font-weight:700}button.secondary{background:#e8f1e9}button.warn{background:#fff2e9;color:#9a3e19}button.active{background:#287557;color:white;border-color:#287557;font-weight:700}button.bad{background:#9a4138;color:white;border-color:#9a4138}button:disabled{opacity:.45}input,textarea,select{width:100%;border:1px solid #b7c7bd;border-radius:10px;font:inherit;padding:12px;background:white;font-size:16px}label{display:block;font-weight:600;margin:12px 0 5px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}.choices.five{grid-template-columns:repeat(2,minmax(0,1fr))}.choices button{font-size:17px;min-height:57px}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{font-size:12px;border-radius:20px;padding:5px 10px;background:#e4eee8}.hide{display:none!important}.notice{background:#fff8e5;padding:11px;border-radius:9px;color:#765419}.success{background:#e6f3e9;padding:10px;border-radius:9px}.count{font-weight:700;font-size:22px}#camera{width:100%;max-height:300px;background:black;border-radius:10px}#list button{width:100%;text-align:left;margin-bottom:6px}.sticky{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dce5dd;padding:8px 12px;display:flex;gap:8px;z-index:4}.sticky button{flex:1}.tag{font-size:12px;color:#577464}.small{font-size:13px}.split{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.split input{text-align:center}.hr{border-top:1px solid #e2e9e3;margin:16px 0}.inline{display:flex;align-items:center;gap:8px}.inline input{width:auto}#toast{position:fixed;top:75px;left:50%;transform:translateX(-50%);background:#1d4938;color:white;padding:12px 18px;border-radius:12px;display:none;z-index:20;max-width:90vw} @media(min-width:600px){.choices.five{grid-template-columns:repeat(5,1fr)}}
</style></head><body><header><strong>🍅 番茄田間選拔記錄器 <span style="font-size:12px">v1</span></strong><small>離線記錄・大按鈕・按儲存寫入本機</small></header><main>
<section id="home"><div class="bar"><h2>田間選拔</h2><span class="pill" id="dbstate">準備中</span></div><div class="row"><button class="primary" id="new">＋ 選拔單株</button><button id="showlist">查看已選拔單株</button></div><div class="hr"></div><h3>來源品系</h3><div class="muted">先匯入 v27 品系牌的「QR製牌紀錄」CSV，才能以 QR 識別碼對應品系。</div><div class="row" style="margin-top:10px"><button id="loadcsv">匯入品系牌 CSV</button><button id="scanline">掃描品系牌</button></div><input id="csvfile" type="file" accept=".csv,text/csv" multiple hidden><label>來源品系（可搜尋／手動選取）</label><input id="linequery" list="lines" placeholder="輸入田間名稱，或掃描品系牌"><datalist id="lines"></datalist><div class="muted" id="lineinfo">尚未指定來源品系</div><label>選拔人員（選填）</label><input id="operator" placeholder="例如：研究人員姓名或代號"><div class="hr"></div><h3>資料備份與合併</h3><div class="row"><button id="export">匯出 JSON 備份</button><button id="import">匯入／合併 JSON</button></div><input id="jsonfile" type="file" accept=".json,application/json" multiple hidden><p class="notice small">資料目前只儲存在這台裝置的這個瀏覽器。請定期匯出 JSON；清除網站資料或更換手機可能造成紀錄遺失。</p></section>
<section id="records" class="hide"><div class="bar"><h2>已選拔單株</h2><button id="backhome">返回</button></div><input id="filter" placeholder="搜尋編號、品系或譜系"><p class="muted" id="total"></p><div id="list"></div></section>
<section id="editor" class="hide"><div class="bar"><h2 id="editTitle">單株選拔</h2><button id="closeeditor">返回</button></div><label>單株調查編號</label><div class="row"><input id="plantid" placeholder="115秋003"><button id="scanplant">掃 QR</button></div><div class="muted">單株 QR 內容直接使用完整調查編號，不使用品系牌的隨機識別碼。</div><label>來源品系</label><input id="sourceline" list="lines" placeholder="田間名稱"><label>來源品系 QR 識別碼</label><input id="sourceqr" placeholder="由品系 CSV／掃碼帶入，無法確認可留空"><label>譜系（可修改）</label><input id="pedigree" placeholder="由來源品系及選拔編號自動建議"><div class="row"><button id="genped">依規則產生譜系</button></div><label>選拔日期</label><input type="date" id="seldate"><div class="hr"></div><h2>田間性狀</h2><div id="traits"></div><h3>每串果數（選填）</h3><div class="split"><div><label>第 1 串</label><input type="number" min="0" inputmode="numeric" data-field="cluster1"></div><div><label>第 2 串</label><input type="number" min="0" inputmode="numeric" data-field="cluster2"></div><div><label>第 3 串</label><input type="number" min="0" inputmode="numeric" data-field="cluster3"></div></div><h3>裂果程度</h3><div class="choices three" data-choice="crackSeverity"></div><label>選拔原因／其他觀察</label><textarea id="notes" rows="3" placeholder="可留空"></textarea><p class="muted">選項未點選代表「未調查」，與「無病徵」不同。</p><div class="row"><button class="primary" id="save">儲存選拔紀錄</button><button id="history">修改歷程</button></div><div id="histbox" class="hide small"></div></section>
<section id="scanner" class="hide"><div class="bar"><h2>掃描 QR</h2><button id="stopscan">關閉</button></div><video id="camera" playsinline muted autoplay></video><p id="scanstatus" class="muted">準備相機…</p><label>掃不到時可直接輸入 QR 內容</label><input id="scanmanual" placeholder="貼上／輸入 QR 解碼文字"><button class="primary" id="manualok" style="width:100%;margin-top:8px">確認識別碼</button></section>
</main><div class="sticky" id="foot"><button id="footHome">首頁</button><button id="footNew" class="primary">＋ 選拔單株</button><button id="footList">紀錄</button></div><div id="toast"></div><script>
'use strict';const DB='tomato-selection-v1',STORE='kv';let db,lines={},plants={},current=null,scanTarget='',stream=null,scanLoop=false,activeLine='',activeQR='';const $=id=>document.getElementById(id),today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),clone=x=>JSON.parse(JSON.stringify(x));
const specs=[['growth','生長型',['停心 D','半停心 H','非停心 I']],['inflorescence','花序',['總狀 R','複總狀 C']],['color','成熟果色',['紅','橙','黃','綠','紫黑','粉','白','棕','其他']],['stripe','斑紋',['無','紅','綠','黃','其他']],['shape','果型',['扁平型','微扁形','球形','高球形','長筒形','橢圓形','心形','倒卵形','卵形','梨型']],['calyx','萼片大小',['大','中','小']],['tylcv','捲葉病徵',['有','無']],['wilt','青枯病徵',['有','無']],['spot','斑點病徵',['有','無']],['blight','疫病病徵',['有','無']],['ringCrack','環裂',['有','無']],['radialCrack','縱裂',['有','無']],['sunscald','日燒',['有','無']],['uneven','轉色不好',['有','無']],['window','開窗',['有','無']],['beautiful','果美',['有','無']]];const severity=['輕微','中等','嚴重'];let form={};
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2800)}function page(id){for(let x of ['home','records','editor','scanner'])$(x).classList.toggle('hide',x!==id);$('foot').classList.toggle('hide',id==='scanner');window.scrollTo(0,0)}
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function get(k){return new Promise((resolve,reject)=>{let r=db.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function put(k,v){return new Promise((resolve,reject)=>{let t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,k);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}async function persist(){await Promise.all([put('lines',lines),put('plants',plants)]);$('dbstate').textContent='已儲存於本機'}
function csvParse(text){text=text.replace(/^\uFEFF/,'');let out=[],row=[],s='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){s+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(s);s=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(s);if(row.some(x=>x.trim()))out.push(row);row=[];s=''}else s+=c}row.push(s);if(row.some(x=>x.trim()))out.push(row);return out}
function updateLines(){let a=Object.values(lines);$('lines').innerHTML='';for(let x of [...new Set(a.map(x=>x.name))].sort()){let e=document.createElement('option');e.value=x;$('lines').append(e)}$('lineinfo').textContent=`已載入 ${a.length} 筆品系 QR 對應；目前來源：${activeLine||'未指定'}`}
function selectLineByName(n){let m=Object.values(lines).filter(x=>x.name===n);activeLine=n;activeQR=m.length===1?m[0].qr:'';updateLines();if(m.length>1)toast('同名品系有多個 QR，請掃描來源品系牌確認')}
$('linequery').addEventListener('change',()=>selectLineByName($('linequery').value.trim()));$('linequery').addEventListener('input',()=>{activeLine=$('linequery').value.trim();activeQR=''});
$('loadcsv').onclick=()=>$('csvfile').click();$('csvfile').onchange=async e=>{let added=0,invalid=0;for(let f of e.target.files){let rows=csvParse(await f.text()),headers=rows.shift()?.map(x=>x.trim())||[],q=headers.indexOf('QR識別碼'),n=headers.indexOf('田間名稱');if(q<0||n<0){invalid++;continue}for(let row of rows){let qr=(row[q]||'').trim(),name=(row[n]||'').trim();if(!qr||!name)continue;if(lines[qr]&&lines[qr].name!==name){toast('發現相同 QR 對應不同品系，已停止匯入');return}if(!lines[qr])added++;lines[qr]={qr,name,cross:row[headers.indexOf('雜交組合')]||'',season:row[headers.indexOf('作期')]||''}}}await persist();updateLines();toast(`新增 ${added} 筆品系；格式不符檔案 ${invalid} 個`);e.target.value=''};
function drawTraits(){let target=$('traits');target.innerHTML='';for(let [key,title,opts] of specs){let h=document.createElement('h3');h.textContent=title;target.append(h);let wrap=document.createElement('div');wrap.className='choices '+(opts.length===3?'three':opts.length>4?'five':'');wrap.dataset.choice=key;for(let opt of opts){let b=document.createElement('button');b.textContent=opt;b.type='button';b.dataset.value=opt;b.onclick=()=>{form[key]=form[key]===opt?null:opt;refreshButtons()};wrap.append(b)}target.append(wrap)}let sev=$('[data-choice="crackSeverity"]');for(let opt of severity){let b=document.createElement('button');b.textContent=opt;b.dataset.value=opt;b.onclick=()=>{form.crackSeverity=form.crackSeverity===opt?null:opt;refreshButtons()};sev.append(b)}}function refreshButtons(){document.querySelectorAll('[data-choice]').forEach(w=>w.querySelectorAll('button').forEach(b=>b.classList.toggle('active',form[w.dataset.choice]===b.dataset.value)))}
function suggestPed(){let id=$('plantid').value.trim(),src=$('sourceline').value.trim();let m=id.match(/^(\d{3})[^\d]*?(\d{3})$/);if(!m||!src){toast('請先填完整單株編號與來源品系');return}let tail=m[1].slice(-2)+m[2];$('pedigree').value=src+'-'+tail;toast('已產生譜系建議，可自行修改')}
function edit(id){current=id||null;let p=id?plants[id]:null;form=clone(p?.traits||{});$('editTitle').textContent=p?'修改單株選拔':'新增單株選拔';$('plantid').value=p?.id||'';$('plantid').readOnly=!!p;$('sourceline').value=p?.source||activeLine;$('sourceqr').value=p?.sourceQR||activeQR;$('pedigree').value=p?.pedigree||'';$('seldate').value=p?.date||today();$('notes').value=p?.notes||'';for(let el of document.querySelectorAll('[data-field]'))el.value=p?.[el.dataset.field]??'';$('histbox').classList.add('hide');refreshButtons();page('editor')}
$('genped').onclick=suggestPed;$('new').onclick=()=>edit();$('footNew').onclick=()=>edit();$('footHome').onclick=()=>page('home');$('footList').onclick=()=>renderList();$('showlist').onclick=()=>renderList();$('backhome').onclick=()=>page('home');$('closeeditor').onclick=()=>page('home');
$('save').onclick=async()=>{let id=$('plantid').value.trim(),src=$('sourceline').value.trim();if(!id||!src){toast('必須填單株調查編號與來源品系');return}if(!current&&plants[id]){toast('此單株編號已存在！請從紀錄列表開啟修改');return}if(current&&current!==id){toast('既有單株編號不可修改');return}let old=plants[id],record={id,source:src,sourceQR:$('sourceqr').value.trim(),pedigree:$('pedigree').value.trim(),date:$('seldate').value,notes:$('notes').value,operator:$('operator').value,traits:clone(form),updated:new Date().toISOString(),created:old?.created||new Date().toISOString(),rev:(old?.rev||0)+1,history:old?.history||[]};for(let el of document.querySelectorAll('[data-field]'))record[el.dataset.field]=el.value===''?null:Number(el.value);if(old){record.history=[...record.history,{at:old.updated,snapshot:{...old,history:undefined}}]}plants[id]=record;await persist();current=id;toast('已儲存：'+id);renderList()};
$('history').onclick=()=>{let p=plants[current],el=$('histbox');el.classList.toggle('hide');el.textContent=p?`目前版本 ${p.rev}；歷史修改 ${p.history.length} 次。\n`+p.history.map(x=>x.at+'：'+JSON.stringify(x.snapshot)).join('\n'): '尚未建立紀錄';el.style.whiteSpace='pre-wrap';el.style.overflowWrap='anywhere'};
function renderList(){let q=$('filter').value.trim().toLowerCase();let arr=Object.values(plants).filter(p=>[p.id,p.source,p.pedigree].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.updated.localeCompare(a.updated));$('total').textContent=`共 ${Object.keys(plants).length} 株，符合搜尋 ${arr.length} 株`;$('list').innerHTML='';for(let p of arr){let b=document.createElement('button');b.innerHTML=`<b></b><span class="tag"></span>`;b.querySelector('b').textContent=p.id+'　'+p.source;b.querySelector('span').textContent=(p.pedigree||'未填譜系')+'　｜　'+(p.date||'未填日期');b.onclick=()=>edit(p.id);$('list').append(b)}page('records')}$('filter').oninput=renderList;
function download(name,obj){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(()=>fallback(blob,name))}else fallback(blob,name)}function fallback(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}$('export').onclick=()=>download('番茄田間選拔_'+today()+'.json',{app:'tomato-selection',version:1,exported:new Date().toISOString(),lines,plants});$('import').onclick=()=>$('jsonfile').click();$('jsonfile').onchange=async e=>{let nextLines=clone(lines),nextPlants=clone(plants),add=0,duplicate=0,conflict=[];try{for(let f of e.target.files){let data=JSON.parse(await f.text());if(data.app!=='tomato-selection'||data.version!==1||!data.plants||!data.lines)throw Error('不是本程式 v1 的備份');for(let [k,v] of Object.entries(data.lines)){if(nextLines[k]&&nextLines[k].name!==v.name){conflict.push('品系 QR '+k);continue}nextLines[k] ||=v}for(let [k,v] of Object.entries(data.plants)){if(!nextPlants[k]){nextPlants[k]=v;add++}else if(JSON.stringify(nextPlants[k])===JSON.stringify(v)){duplicate++}else{conflict.push('單株 '+k)}}}if(conflict.length){alert(`有 ${conflict.length} 筆不同版本或來源衝突，為避免覆蓋，整批未匯入。請保留原檔，先人工核對：\n`+conflict.slice(0,12).join('\n'));return}if(!confirm(`將新增 ${add} 株、略過相同紀錄 ${duplicate} 株，確定合併？`))return;lines=nextLines;plants=nextPlants;await persist();updateLines();toast('合併完成，新增 '+add+' 株')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};
function scanned(value){value=value.trim();stopScanner();if(!value)return;if(scanTarget==='line'){let x=lines[value];if(!x){toast('找不到這張品系牌的 QR；請先匯入製牌 CSV');return}activeLine=x.name;activeQR=value;$('linequery').value=x.name;updateLines();toast('已選來源品系：'+x.name);page('home')}else if(scanTarget==='plant'){$('plantid').value=value;page('editor');toast('已掃入單株編號：'+value)}}
async function startScanner(target){scanTarget=target;page('scanner');$('scanmanual').value='';let status=$('scanstatus');if(!navigator.mediaDevices?.getUserMedia){status.textContent='此瀏覽器或網址無法使用相機，請改用手動輸入';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('camera').srcObject=stream;await $('camera').play();if(!('BarcodeDetector'in window)){status.textContent='此瀏覽器不支援內建 QR 辨識；可使用手動輸入。後續版本將加入離線掃碼元件。';return}let detector=new BarcodeDetector({formats:['qr_code']});scanLoop=true;status.textContent='請將 QR 放入畫面';while(scanLoop){try{let found=await detector.detect($('camera'));if(found.length){scanned(found[0].rawValue);break}}catch(e){}await new Promise(r=>setTimeout(r,180))}}catch(e){status.textContent='相機無法開啟：'+e.message+'。請用 Safari 的 HTTPS 網頁開啟，或手動輸入。'}}function stopScanner(){scanLoop=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('camera').srcObject=null} $('scanline').onclick=()=>startScanner('line');$('scanplant').onclick=()=>startScanner('plant');$('stopscan').onclick=()=>{stopScanner();page(scanTarget==='plant'?'editor':'home')};$('manualok').onclick=()=>scanned($('scanmanual').value);
(async()=>{try{db=await openDB();lines=await get('lines')||{};plants=await get('plants')||{};drawTraits();updateLines();$('dbstate').textContent='本機資料庫就緒'}catch(e){$('dbstate').textContent='儲存失敗';alert('無法啟用本機資料庫：'+e.message)}})();
</script></body></html>
